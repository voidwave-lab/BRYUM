# Configuration for `cross` (https://github.com/cross-rs/cross)
# Installs target-architecture ALSA development headers (`libasound2-dev`)
# inside the cross container for multiarch GNU Linux & Raspberry Pi targets,
# and symlinks `alsa.pc` into `/usr/share/pkgconfig` so `pkg-config` always finds it.

[target.i686-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture i386",
    "apt-get update && apt-get install --assume-yes pkg-config libasound2-dev:i386",
    "mkdir -p /usr/share/pkgconfig && cp -f /usr/lib/i386-linux-gnu/pkgconfig/alsa.pc /usr/share/pkgconfig/alsa.pc",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install --assume-yes pkg-config libasound2-dev:arm64",
    "mkdir -p /usr/share/pkgconfig && cp -f /usr/lib/aarch64-linux-gnu/pkgconfig/alsa.pc /usr/share/pkgconfig/alsa.pc",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture armhf",
    "apt-get update && apt-get install --assume-yes pkg-config libasound2-dev:armhf",
    "mkdir -p /usr/share/pkgconfig && cp -f /usr/lib/arm-linux-gnueabihf/pkgconfig/alsa.pc /usr/share/pkgconfig/alsa.pc",
]
